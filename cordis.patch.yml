# dsh-scholar-lab bundle patch: adds the Google Scholar tools (host half) and
# the search panel (client half, browser roster) to the profile.
#
# Layer semantics (see @deepseek-ai/dsh-base): a patch REPLACES the targeted
# row's whole config and rows are addressed by id with last-write-wins. The
# ids below are unique to this bundle, so no in-box row is touched.
- insert:
    # Host row: the loader instantiates the package's main export as a Cordis
    # plugin (lib/host.js). Registers scholar_search / scholar_abstract tools
    # and provides the `scholarLab` service the client half calls.
    - id: scholar-lab
      name: '@junma11/dsh-scholar-lab'

    # No loader row for the browser half: @deepseek-ai/dsh-client-modules
    # discovers it from this package's `dsh.client` manifest declaration and
    # serves the ./client export itself. A second row naming this package
    # would mount lib/host.js again and fail on duplicate tool registration.
